[package]
name = "sp-mcp"
version = "0.1.0"
edition = "2021"

[lib]
name = "sp_mcp"
path = "src/lib.rs"

[[bin]]
name = "sp-mcp"
path = "src/main.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
sp-typst = { path = "../sp-typst" }
sp-check = { path = "../sp-check" }
serde_json = "1"
rmcp = { version = "3", features = ["transport-io", "transport-streamable-http-server", "macros", "server", "schemars"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
anyhow = "1"
futures = "0.3"
axum = "0.8"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tempfile = "3"
